services:
  db:
    image: postgres:16
    container_name: moldai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moldai
      POSTGRES_PASSWORD: moldai
      POSTGRES_DB: moldai
    ports:
      # host 5433 (not 5432) so it doesn't collide with another local Postgres
      - "5433:5432"
    volumes:
      - moldai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moldai -d moldai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: moldai-redis
    restart: unless-stopped
    # Counters are meant to be ephemeral: persistence off, no volume mounted.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # host 6380 (not 6379) so it doesn't collide with another local Redis,
      # mirroring the db's 5433 choice
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dev
    container_name: moldai-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://moldai:moldai@db:5432/moldai?schema=public
      REDIS_URL: redis://redis:6379
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  cron:
    build:
      context: .
      target: dev
    container_name: moldai-cron
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://moldai:moldai@db:5432/moldai?schema=public
    command: sh -c "while true; do npx tsx scripts/cron-renew.ts; sleep 3600; done"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  moldai-pgdata:
