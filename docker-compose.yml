services:
  db:
    image: postgres:16
    container_name: moldai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moldai
      POSTGRES_PASSWORD: moldai
      POSTGRES_DB: moldai
    ports:
      - "5433:5432"
    volumes:
      - moldai-pgdata:/var/lib/postgresql/data

volumes:
  moldai-pgdata:
