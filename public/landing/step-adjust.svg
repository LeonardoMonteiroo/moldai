<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 152" width="330" height="152" role="img">
  <!--
    Step 2, "Ajuste conversando": the seam check that runs on every generation.
    Cartooned from the real conflict card - the wording, the two measured
    lengths, the shortfall and the "sem custo" note are all what the product
    actually shows when a sleeve cap stops matching its armhole.

    The numbers are the ones the app produced for this shirt (42,9 / 39,8 /
    5,6 cm), not invented figures.
  -->
  <defs>
    <pattern id="g2" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#e8e4d8" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="330" height="152" fill="#f4f2ec" />
  <rect width="330" height="152" fill="url(#g2)" />

  <!-- The sleeve and the body panel it has to join, with the mismatch circled
       on each side: the sleeve's cap on one, the body's armhole on the other.
       Different silhouettes on purpose - a dome for the cap, flat shoulders
       and a neck scoop for the panel. -->
  <g stroke="#1c1c19" stroke-width="2" stroke-linejoin="round">
    <path transform="translate(12,18) scale(0.92)" fill="#ffffff"
          d="M16 120 L10 46 Q25 4 40 46 L34 120 Z" />
    <path transform="translate(64,18) scale(0.92)" fill="#eaeee2"
          d="M8 120 L8 52 Q10 34 18 22 L30 14 Q40 26 50 14 L62 22 Q70 34 72 52 L72 120 Z" />
  </g>
  <g fill="none" stroke="#b5502f" stroke-width="1.5" stroke-dasharray="3 3">
    <circle cx="46" cy="56" r="9" />
    <circle cx="88" cy="58" r="9" />
  </g>

  <!-- the conflict card -->
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <rect x="160" y="12" width="158" height="128" rx="10" fill="#ffffff" stroke="#ded9cc" />
    <text x="172" y="30" font-size="8" font-weight="600" fill="#6e6b60" letter-spacing="0.8">CONFLITO</text>
    <text x="172" y="46" font-size="11" font-weight="600" fill="#1c1c19">Cava e manga</text>
    <text x="172" y="59" font-size="11" font-weight="600" fill="#1c1c19">não batem</text>

    <text x="172" y="79" font-size="9" fill="#5a564a">Cava · frente</text>
    <text x="306" y="79" font-size="9" font-weight="600" fill="#1c1c19" text-anchor="end">42,9 cm</text>
    <rect x="172" y="84" width="134" height="3" rx="1.5" fill="#4a5a3a" />

    <text x="172" y="102" font-size="9" fill="#5a564a">Cava · copa</text>
    <text x="306" y="102" font-size="9" font-weight="600" fill="#1c1c19" text-anchor="end">39,8 cm</text>
    <rect x="172" y="107" width="106" height="3" rx="1.5" fill="#b5502f" />

    <text x="172" y="126" font-size="10" font-weight="600" fill="#b5502f">falta 5,6 cm</text>
    <rect x="240" y="115" width="66" height="16" rx="8" fill="#eaeee2" />
    <text x="273" y="126" font-size="8" fill="#4a5a3a" text-anchor="middle">sem custo</text>
  </g>
</svg>
