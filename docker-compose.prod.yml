# Production override: docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.prod.yml up --build
# Builds the `runner` target (next start), removes the dev bind mounts, and
# stops publishing db/redis to the host -- #25: Docker's published ports
# bind 0.0.0.0 and its iptables DOCKER chain bypasses ufw, so a host-published
# db/redis on a VPS is reachable from the internet regardless of any firewall
# rule. The app reaches both over the compose network (db:5432, redis:6379),
# which is all it needs in production.
services:
  app:
    build:
      target: runner
      args:
        # Interpolated from the project env file (--env-file .env.local), the
        # same way POSTGRES_PASSWORD below is -- a service's own `env_file:`
        # is a runtime concern and does not reach a build arg.
        APP_URL: ${APP_URL:?set APP_URL in .env.local}
        # #275: optional (":-", not ":?") -- NEXT_PUBLIC_SENTRY_DSN is
        # inlined at build time (see the Dockerfile), so unlike every other
        # Sentry var it can't just live in `environment:` below. Empty
        # default keeps `docker compose up` working for a deploy that never
        # sets it. SENTRY_AUTH_TOKEN/ORG/PROJECT are build-time-only too
        # (next.config.ts's source-map upload), so they ride along here
        # rather than in `environment:` even though nothing reads them at
        # runtime.
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    restart: unless-stopped
    volumes: !reset []
    environment:
      NODE_ENV: production
      WATCHPACK_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
      DATABASE_URL: postgresql://moldai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@db:5432/moldai?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.local}@redis:6379

  # #73: this service didn't exist here at all, so the base file's `cron:`
  # ran unmodified in prod -- the `dev` build target (no application code,
  # only a bind mount at runtime), no restart policy, and racing the app
  # container's own migrate on every stack start. Mirrors `app` above,
  # minus the ports it never had.
  cron:
    build:
      target: runner
      # Identical to app's above on purpose: both build the same `runner`
      # target, and a differing build arg would fork the layer cache into two
      # near-identical images. The cron loop never renders a page, so the
      # value itself is inert here.
      args:
        APP_URL: ${APP_URL:?set APP_URL in .env.local}
        # Mirrors `app`'s above -- same reasoning, and both MUST match so
        # the build args stay identical between the two services (the
        # comment above already explains why: a differing arg forks the
        # layer cache into two near-identical images).
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    restart: unless-stopped
    volumes: !reset []
    entrypoint: ["docker-entrypoint-cron.sh"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://moldai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.local}@db:5432/moldai?schema=public

  db:
    ports: !reset []

  redis:
    ports: !reset []
